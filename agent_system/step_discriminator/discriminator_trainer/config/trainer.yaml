# Discriminator Trainer Configuration
# Based on verl/trainer/config/sft_trainer.yaml

data:
  train_batch_size: 128
  micro_batch_size_per_gpu: 2
  train_files: results/discriminator_data/train.parquet
  val_files: results/discriminator_data/val.parquet
  # Data keys
  prompt_key: prompt
  response_key: response
  prompt_dict_keys: []
  response_dict_keys: []
  # Sequence settings
  max_length: 4096
  truncation: right
  balance_dp_token: False
  chat_template: null
  # Custom dataset class (null = use default SFTDataset)
  custom_cls:
    path: null
    name: null
  use_shm: False

model:
  partial_pretrain: Qwen/Qwen2.5-7B-Instruct
  use_shm: False
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: True
  trust_remote_code: True
  # Full parameter fine-tuning (set lora_rank > 0 for LoRA)
  lora_rank: 0
  lora_alpha: 16
  target_modules: all-linear
  use_liger: False
  strategy: fsdp

optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine

ulysses_sequence_parallel_size: 1
use_remove_padding: False

trainer:
  default_local_dir: results/discriminator_model
  default_hdfs_dir: null
  resume_path: null
  project_name: step-discriminator
  experiment_name: discriminator-sft
  total_epochs: 3
  total_training_steps: null
  logger: ['console', 'wandb']
  seed: 42
